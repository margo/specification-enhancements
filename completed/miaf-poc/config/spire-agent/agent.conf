agent {
    data_dir = "/run/spire/agent/data"
    log_level = "INFO"

    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/agent-socket/api.sock"
    trust_domain = "margo.example.com"

    # The trust bundle root (Step CA's root, piped through SPIRE Server) is
    # written to this path by the entries-bootstrap container before the agent starts.
    trust_bundle_path = "/run/spire/agent/bootstrap/bundle.pem"
}

plugins {
    KeyManager "memory" {
        plugin_data {}
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}
